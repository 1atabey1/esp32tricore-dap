[project]
name = "mcds-trace"
version = "0.1.0"
description = "Capture, decode and plot TC3xx miniMCDS data/watch-point traces from the esp32jtag probe"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10",
    "websocket-client>=1.7",
    "flet[all]>=1.0.1",
    "pyelftools>=0.33",
    "pyarrow>=25.0.1",
]

[project.scripts]
mcds-trace = "mcds_trace.cli:main"
mcds-trace-ui = "mcds_trace.ui.app:main"

[dependency-groups]
dev = [
    "flet-mcp>=1.0.1",
    "playwright>=1.63.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcds_trace"]

[tool.flet]
product = "MCDS Trace"

[tool.flet.app]
path = "src"                          # `flet run` from here starts src/main.py

[tool.pytest.ini_options]
testpaths = ["tests"]
