<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TriCore flash</title>
<style>
  :root {
    --bg:#11141a; --panel:#191d26; --line:#272d3a; --ink:#e6e9ef;
    --dim:#8b93a7; --accent:#4da3ff; --ok:#3ddc84; --warn:#ffb454; --bad:#ff5f56;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 system-ui, sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; font-weight:600; }
  header a { color:var(--dim); text-decoration:none; font-size:13px; }
  header a:hover { color:var(--accent); }
  main { padding:20px; max-width:760px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center;
         margin-bottom:16px; }
  button, input[type=file]::file-selector-button {
    background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:8px 15px; font-size:14px; cursor:pointer;
  }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent);
                   color:#08121f; font-weight:600; }
  input[type=file] { color:var(--dim); font-size:13px; }
  .bar { height:8px; background:var(--panel); border:1px solid var(--line);
         border-radius:6px; overflow:hidden; margin:6px 0 14px; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent);
             transition:width .2s; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
          gap:10px; margin-bottom:8px; }
  .cell { background:var(--panel); border:1px solid var(--line);
          border-radius:9px; padding:10px 12px; }
  .cell .k { color:var(--dim); font-size:11px; text-transform:uppercase;
             letter-spacing:.5px; }
  .cell .v { font-family:var(--mono); font-size:17px; margin-top:3px; }
  .v.ok { color:var(--ok); } .v.warn { color:var(--warn); } .v.bad { color:var(--bad); }
  #log { font-family:var(--mono); font-size:12.5px; white-space:pre-wrap;
         color:var(--dim); background:var(--panel); border:1px solid var(--line);
         border-radius:9px; padding:11px 13px; max-height:220px; overflow:auto; }
  h2 { font-size:13px; color:var(--dim); text-transform:uppercase;
       letter-spacing:.6px; margin:22px 0 8px; font-weight:600; }
  .note { color:var(--dim); font-size:12.5px; max-width:68ch; }
</style>
</head>
<body>
<header>
  <h1>TriCore flash</h1>
  <span id="phase" style="font-family:var(--mono);font-size:12px;color:var(--dim)">idle</span>
  <a href="/">&larr; probe</a>
  <a href="/trace.html">trace</a>
</header>

<main>
  <div class="row">
    <input type="file" id="file" accept=".hex">
    <button id="upload">Upload</button>
    <button id="start" class="primary" disabled>Erase &amp; program</button>
  </div>

  <p class="note">
    Takes an Intel HEX (<code>.hex</code>). Only flashes PFLASH, no UCB or DFLASH.
    Every flash is a full erase & write, not differential.
  </p>

  <div class="bar"><i id="bar"></i></div>

  <div class="grid">
    <div class="cell"><div class="k">Image</div><div class="v" id="s_image">-</div></div>
    <div class="cell"><div class="k">Programmed</div><div class="v" id="s_done">-</div></div>
    <div class="cell"><div class="k">Sectors</div><div class="v" id="s_sect">-</div></div>
    <div class="cell"><div class="k">Elapsed</div><div class="v" id="s_ms">-</div></div>
    <div class="cell"><div class="k">Verified</div><div class="v" id="s_ver">-</div></div>
  </div>

  <h2>Log</h2>
  <div id="log"></div>
</main>

<script>
const el = id => document.getElementById(id);
const fmt = n => n < 1024 ? n + " B"
               : n < 1048576 ? (n / 1024).toFixed(1) + " kB"
               : (n / 1048576).toFixed(2) + " MB";

function log(msg) {
  el("log").textContent += new Date().toTimeString().slice(0, 8) + "  " + msg + "\n";
  el("log").scrollTop = el("log").scrollHeight;
}

el("upload").onclick = async () => {
  const f = el("file").files[0];
  if (!f) { log("pick a .hex first"); return; }

  el("upload").disabled = true;
  log("uploading " + f.name + " (" + fmt(f.size) + ")");
  try {
    /*
     * Sent as the raw body, not multipart: the probe parses the records as they
     * arrive, so the 2 MB of text never exists anywhere at once - only the
     * ~700 kB of program content it describes.
     */
    const r = await fetch("/api/flash/upload", { method: "POST", body: f });
    const text = (await r.text()).trim();
    log(text);
    if (r.ok) { el("start").disabled = false; }
  } catch (e) {
    log("upload failed: " + e.message);
  }
  el("upload").disabled = false;
};

el("start").onclick = async () => {
  if (!confirm("Erase and reprogram the target's flash?")) return;
  el("start").disabled = true;
  try {
    const r = await fetch("/api/flash/start", { method: "POST" });
    log((await r.text()).trim());
  } catch (e) {
    log("could not start: " + e.message);
  }
};

let wasRunning = false;
let lastState = "idle";

async function poll() {
  let kv;
  try {
    const text = await (await fetch("/api/flash/status", { cache: "no-store" })).text();
    kv = {};
    /* message= runs to the end of the line, so it is taken off first. */
    const cut = text.indexOf("message=");
    const head = cut < 0 ? text : text.slice(0, cut);
    if (cut >= 0) kv.message = text.slice(cut + 8).trim();
    head.trim().split(/\s+/).forEach(p => {
      const i = p.indexOf("=");
      if (i > 0) kv[p.slice(0, i)] = p.slice(i + 1);
    });
  } catch (e) { return; }

  const num = k => parseInt(kv[k] ?? "0", 10) || 0;
  const running = num("running") === 1;

  el("phase").textContent = kv.phase + (running ? " ..." : "");
  el("s_image").textContent = num("image_bytes") ? fmt(num("image_bytes")) : "-";
  el("s_done").textContent = num("total")
    ? fmt(num("done")) + " / " + fmt(num("total")) : "-";
  el("s_sect").textContent = num("sectors")
    ? num("sectors_done") + " / " + num("sectors") : "-";
  el("s_ms").textContent = num("ms") ? (num("ms") / 1000).toFixed(1) + " s" : "-";

  const v = el("s_ver");
  if (kv.phase === "done") { v.textContent = "yes"; v.className = "v ok"; }
  else if (kv.phase === "failed") { v.textContent = "no"; v.className = "v bad"; }
  else { v.textContent = "-"; v.className = "v"; }

  el("bar").style.width = num("total")
    ? Math.round(100 * num("done") / num("total")) + "%" : "0";

  if (lastState != kv.phase) {
    log("Now in state: " + kv.phase);
    lastState = kv.phase;
  }

  if (wasRunning && !running) {
    log(kv.phase + ": " + (kv.message || ""));
    if (kv.phase === "done") {
      log("elapsed " + (num("ms") / 1000).toFixed(1) + " s");
    }
    el("start").disabled = false;
  }
  wasRunning = running;
}
setInterval(poll, 500);
poll();
</script>
</body>
</html>
